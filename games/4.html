<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="套圈博弈">
    
    <title>高級套圈博弈挑戰</title>

    <style>
        :root {
            --primary: #3B82F6; --success: #10B981; --danger: #EF4444;
            --dark: #030712; --light: #F8FAFC; --accent: #FACC15;
            --glowing-cyan: #06B6D4; --ai-color: #A855F7;
        }

        html { font-size: 16px; transition: background-color 0.3s ease-out; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--dark); color: var(--light); user-select: none; touch-action: none; }

        .game-wrapper { display: flex; width: 100%; height: 100%; overflow: hidden; }

        .geometry-pane { position: relative; flex: 2; height: 100%; border-right: 4px solid #334155; overflow: hidden; display: flex; flex-direction: column; box-sizing: border-box; cursor: crosshair;}
        .viz-layer { flex: 1; min-height: 0; width: 100%; position: relative; }

        #main-canvas, #particle-canvas, #ripple-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; object-fit: cover;}
        #particle-canvas { z-index: 2; pointer-events: none; }
        #ripple-canvas { z-index: 3; pointer-events: none; }

        .q-floating-header { 
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            width: 95%; z-index: 10; display: flex; flex-direction: column; 
            align-items: center; pointer-events: none; 
        }
        
        .question-stem { 
            font-size: clamp(1.2rem, 2.5vw, 1.8rem); font-weight: bold; 
            background: rgba(15, 23, 42, 0.9); padding: 10px 30px; 
            border-radius: 12px; border: 2px solid #475569; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); color: var(--accent); text-align: center;
        }
        
        .instruction-text { 
            font-size: clamp(1rem, 2vw, 1.3rem); color: var(--light); margin-top: 5px; 
            font-weight: bold; padding: 6px 20px; background: rgba(0,0,0,0.75); 
            border-radius: 8px; text-align: center;
        }

        .info-pane { flex: 1; height: 100%; background: radial-gradient(circle at top right, #1f2937 0%, #030712 100%); display: flex; flex-direction: column; padding: 3%; box-sizing: border-box; justify-content: flex-start; align-items: stretch; border-left: 2px solid #1f2937; z-index: 10;}

        .info-card { background: rgba(255,255,255,0.03); border: 3px solid #334155; border-radius: 20px; padding: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4); margin-bottom: 20px;}
        .player-info { font-size: clamp(1.2rem, 1.8vw, 1.8rem); color: var(--glowing-cyan); margin-bottom: 10px; font-weight: bold; }
        
        .rem-box { font-size: clamp(3rem, 5vw, 5rem); color: var(--success); font-weight: bold; font-family: monospace; text-shadow: 0 0 20px rgba(16,185,129,0.5); margin: 10px 0;}
        .rem-box.ai-turn { color: var(--ai-color); text-shadow: 0 0 20px rgba(168,85,247,0.5); }

        .formula-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; background: rgba(0,0,0,0.2); border-radius: 20px; border: 4px solid var(--primary); padding: 5%; box-shadow: 0 0 40px rgba(59, 130, 246, 0.2); transition: filter 0.3s;}
        .formula-zone.locked { filter: grayscale(100%) opacity(0.3); pointer-events: none;}
        .formula-title { font-size: clamp(1.3rem, 2.5vw, 2rem); color: #94A3B8; margin-top: 0; margin-bottom: 20px; letter-spacing: 2px;}

        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            width: 100%;
        }

        .take-btn {
            background: rgba(15, 23, 42, 0.8); border: 3px solid #475569; color: var(--light);
            padding: 15px 10px; border-radius: 12px; font-size: clamp(1.2rem, 2vw, 1.5rem);
            font-weight: bold; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .take-btn:hover { border-color: var(--primary); background: rgba(59, 130, 246, 0.2); transform: scale(1.05); }
        .take-btn:active { transform: scale(0.95); }

        @keyframes bgShake { 0% { transform: translate(0,0); } 20% { transform: translate(-15px, 10px) rotate(-1deg); } 40% { transform: translate(15px, -10px) rotate(1deg); } 60% { transform: translate(-15px, -10px) rotate(-1deg); } 80% { transform: translate(15px, 10px) rotate(1deg); } 100% { transform: translate(0,0); } }
        .main-error { animation: bgShake 0.35s ease-in-out both; border-right: 15px solid var(--danger) !important; box-shadow: inset 0 0 250px rgba(239,68,68,0.7) !important; }
        .main-success { border-right: 15px solid var(--success); box-shadow: inset 0 0 150px rgba(16,185,129,0.3); transition: all 0.3s; }

        .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(7, 11, 20, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(10px); }
        .hidden { display: none !important; }

        .player-input { font-size: clamp(1rem, 2vw, 1.5rem); padding: 15px 20px; border-radius: 15px; border: 4px solid #475569; background: rgba(15,23,42,0.8); color: var(--light); text-align: center; outline: none; }
        .player-input:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        .mega-btn { font-size: clamp(1.2rem, 2.5vw, 1.5rem); background: var(--primary); color: white; border: none; border-radius: 15px; cursor: pointer; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4); transition: all 0.2s; white-space: nowrap; outline: none; }
        .mega-btn:hover, .mega-btn:active { transform: scale(1.05) translateY(-2px); background: #1D4ED8; }

        .ritual-text { position: absolute; font-size: clamp(3rem, 6vw, 6rem); font-weight: bold; font-style: italic; opacity: 0; z-index: 50; text-shadow: 0 0 30px rgba(0,0,0,0.9); pointer-events: none; }
        @keyframes flyUp { 0% { opacity: 1; transform: translateY(40px) scale(0.5); } 20% { opacity: 1; transform: translateY(0) scale(1.2); } 80% { opacity: 1; transform: translateY(-100px) scale(1); } 100% { opacity: 0; transform: translateY(-150px) scale(0.8); } }

        .fullscreen-btn { position: fixed; top: 10px; right: 10px; background: rgba(15, 23, 42, 0.8); border: 2px solid #475569; color: var(--light); padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: clamp(0.9rem, 1.5vw, 1.2rem); font-weight: bold; z-index: 1000; transition: all 0.2s; }
        .fullscreen-btn:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.05); }

        .controls-top-left { position: fixed; top: 10px; left: 10px; z-index: 1000; display: flex; gap: 10px; }
        .layout-btn { background: rgba(15, 23, 42, 0.8); border: 2px solid #475569; color: var(--light); padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: clamp(0.9rem, 1.5vw, 1.2rem); font-weight: bold; transition: all 0.2s; }
        .layout-btn.active-layout { border-color: var(--accent); color: var(--accent); }

        .game-wrapper.portrait { flex-direction: column; }
        .game-wrapper.portrait .geometry-pane { flex: 1.2; border-right: none; border-bottom: 4px solid #334155; width: 100%; position: relative;}
        .game-wrapper.portrait .info-pane { flex: 1; border-left: none; width: 100%; padding: 15px;}
    </style>
</head>
<body>

<div class="controls-top-left">
    <button id="btn-return" class="layout-btn hidden" style="background: rgba(239, 68, 68, 0.8); border-color: #B91C1C;" onclick="returnToMenu()">🏠 返回</button>
    <button id="btn-portrait" class="layout-btn" onclick="setLayout('portrait')">📱 竪屏</button>
    <button id="btn-landscape" class="layout-btn" onclick="setLayout('landscape')">💻 橫屏</button>
</div>

<div id="start-screen" class="overlay">
    <h1 style="font-size: clamp(2.5rem, 6vw, 5rem); margin-bottom: 0; text-shadow: 0 0 50px var(--glowing-cyan); color: var(--glowing-cyan); text-align: center;">⭕ 霓虹套圈爭奪戰 ⭕</h1>
    <p style="font-size: clamp(1.2rem, 2.5vw, 2rem); color: #94A3B8; margin-top: 10px; font-weight: bold; text-align: center;">高級博弈 (Sprague-Grundy)</p>

    <div style="background: rgba(15, 23, 42, 0.8); border: 2px solid var(--accent); border-radius: 15px; padding: 20px; margin-top: 20px; max-width: 600px; width: 85%; text-align: left; color: var(--light);">
        <h3 style="color: var(--accent); margin-top: 0; text-align: center;">📜 遊戲規則</h3>
        <ul style="font-size: clamp(1rem, 2vw, 1.2rem); line-height: 1.6;">
            <li>場上有 <strong style="color: var(--success);">n 條柱</strong>，第 $n$ 條柱疊了 $n$ 個套圈。</li>
            <li>每次必須點擊一條柱子操作。</li>
            <li>只能選擇 <strong style="color: var(--primary);">「拿取最上方 1 個」</strong> 或 <strong style="color: var(--primary);">「拿走整條柱的全部」</strong>。</li>
            <li><strong style="color: var(--danger);">拿到全場最後一個套圈的玩家獲勝！</strong></li>
            <li>系統將隨機擲硬幣決定誰先手。</li>
            <li><strong style="color: #A855F7;">警告：本局為高級難度，AI 採用無死角必勝邏輯。</strong>成功戰勝它即可獲得專屬獎勵！</li>
        </ul>
    </div>

    <div style="display: flex; flex-direction: row; justify-content: center; align-items: stretch; gap: 10px; margin-top: 30px; width: 85%; max-width: 500px; position: relative; z-index: 20;">
        <input type="text" id="player-name" class="player-input" placeholder="輸入玩家代號..." autocomplete="off" maxlength="12" style="flex: 1; width: 0; min-width: 100px;">
        <button class="mega-btn" ontouchstart="forceUnlockAudio()" onmousedown="forceUnlockAudio()" onclick="startGame()" style="padding: 0 20px; margin: 0;">🚀 挑戰確認</button>
    </div>
</div>

<div class="game-wrapper hidden" id="main-wrapper">
    <div class="geometry-pane" id="geometry-pane">
        <canvas id="particle-canvas"></canvas>
        <canvas id="ripple-canvas"></canvas>
        <div class="q-floating-header">
            <div class="question-stem" id="question-text">載入中...</div>
            <div class="instruction-text" id="instruction">點選一條柱子</div>
        </div>
        <div class="viz-layer">
            <canvas id="main-canvas"></canvas>
        </div>
    </div>

    <div class="info-pane" id="right-pane">
        <div class="info-card" id="stats-card">
            <div class="player-info" id="turn-display">輪到誰？</div>
            <div style="font-size: 1.2rem; color: #64748B;">剩餘套圈</div>
            <div class="rem-box" id="rem-display">0</div>
        </div>

        <div class="formula-zone" id="formula-zone">
            <h3 class="formula-title">執行動作</h3>
            <div id="selection-hint" style="color: var(--accent); margin-bottom: 15px; font-weight: bold;">請先點擊畫面中的柱子</div>
            <div class="action-grid" id="action-grid">
                <!-- 按鈕會由 JS 動態生成 -->
            </div>
        </div>
    </div>
</div>

<button id="fullscreen-toggle" class="fullscreen-btn hidden" onclick="toggleFullScreen()">退出全屏 ⛶</button>

<script>
    // ==========================================
    // 音效與視覺特效引擎 (繼承自原版)
    // ==========================================
    const SoundManager = {
        ctx: null, _sfxGain: null, _bgmGain: null, _bgmTimer: null, _bgmBeat: 0,
        init() {
            if (!this.ctx) {
                const AC = window.AudioContext || window.webkitAudioContext || window.mozAudioContext;
                try { if (AC) this.ctx = new AC(); } catch (e) { this.ctx = null; }
            }
            if (!this.ctx) return;
            if (this.ctx.state === 'suspended') this.ctx.resume().catch(function () {});
            if (!this._sfxGain) { this._sfxGain = this.ctx.createGain(); this._sfxGain.gain.value = 0.8; this._sfxGain.connect(this.ctx.destination); }
            if (!this._bgmGain) { this._bgmGain = this.ctx.createGain(); this._bgmGain.gain.value = 0.15; this._bgmGain.connect(this.ctx.destination); }
        },
        _connectToSFX(fromNode) {
            if (!this.ctx || !this._sfxGain) return;
            fromNode.connect(this._sfxGain);
        },
        startBGM() {
            this.init(); if (!this.ctx || this._bgmTimer != null) return;
            const self = this; const ac = this.ctx; const chords = [[130.81, 164.81, 196.0], [116.54, 146.83, 174.61], [98.0, 123.47, 146.83], [110.0, 138.59, 164.81]];
            this._bgmBeat = 0;
            this._bgmTimer = setInterval(function () {
                if (gameState === 'GAMEOVER') { self.stopBGM(); return; }
                const t = ac.currentTime; const beat = self._bgmBeat++; const chord = chords[Math.floor(beat / 8) % chords.length];
                if (beat % 2 === 0) {
                    const o = ac.createOscillator(); const g = ac.createGain(); const filt = ac.createBiquadFilter();
                    filt.type = 'lowpass'; filt.frequency.setValueAtTime(300, t); o.type = 'triangle'; o.frequency.setValueAtTime(chord[0] * 0.5, t);
                    o.connect(filt); filt.connect(g); g.connect(self._bgmGain); g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
                    o.start(t); o.stop(t + 0.23);
                }
            }, 350);
        },
        stopBGM() { if (this._bgmTimer != null) { clearInterval(this._bgmTimer); this._bgmTimer = null; } },
        play(type) {
            this.init(); if (!this.ctx) return;
            const ac = this.ctx; const t = ac.currentTime;
            function layerChord(freqs, types, vol, dur) {
                const t0 = ac.currentTime;
                freqs.forEach(function (f, i) {
                    const o = ac.createOscillator(); const g = ac.createGain(); o.type = types[i] || 'sine'; o.frequency.setValueAtTime(f, t0);
                    o.connect(g); g.connect(SoundManager._sfxGain);
                    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol * (0.35 + i * 0.15), t0 + 0.03); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
                    o.start(t0); o.stop(t0 + dur + 0.05);
                });
            }
            switch (type) {
                case 'start': layerChord([261.63, 329.63, 392.0, 523.25], ['sine', 'triangle', 'sine', 'triangle'], 0.1, 0.55); break;
                case 'take': layerChord([523.25, 659.25], ['triangle', 'sine'], 0.1, 0.2); break;
                case 'ai_take': layerChord([392, 311.13], ['square', 'sine'], 0.08, 0.3); break;
                case 'success': layerChord([392, 493.88, 587.33, 698.46, 783.99], ['sine', 'triangle', 'sine', 'triangle', 'sine'], 0.12, 0.8); break;
                case 'gameover': { const o = ac.createOscillator(); const g = ac.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(40, t + 1.0); g.gain.setValueAtTime(0.15, t); g.gain.linearRampToValueAtTime(0, t + 1.1); o.connect(g); this._connectToSFX(g, 0); o.start(t); o.stop(t + 1.1); break; }
                case 'select': layerChord([440], ['sine'], 0.1, 0.1); break;
            }
        }
    };

    let particles = []; let ripples = [];
    function createExplosion(x, y, color) { for (let i = 0; i < 25; i++) { particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20 - 5, radius: Math.random() * 6 + 2, color: color, alpha: 1, decay: Math.random() * 0.03 + 0.02 }); } }
    function animateParticles() { pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height); for (let i = particles.length - 1; i >= 0; i--) { let p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.8; p.alpha -= p.decay; if (p.alpha <= 0) { particles.splice(i, 1); continue; } pCtx.globalAlpha = p.alpha; pCtx.fillStyle = p.color; pCtx.beginPath(); pCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); pCtx.fill(); } pCtx.globalAlpha = 1; requestAnimationFrame(animateParticles); }
    function createRipple(x, y) { ripples.push({ x: x, y: y, radius: 0, alpha: 0.6 }); }
    function animateRipples() { rCtx.clearRect(0, 0, rCanvas.width, rCanvas.height); for (let i = ripples.length - 1; i >= 0; i--) { let r = ripples[i]; r.radius += 6; r.alpha -= 0.04; if (r.alpha <= 0) { ripples.splice(i, 1); continue; } rCtx.globalAlpha = r.alpha; rCtx.strokeStyle = "#06B6D4"; rCtx.lineWidth = 3; rCtx.beginPath(); rCtx.arc(r.x, r.y, r.radius, 0, Math.PI * 2); rCtx.stroke(); } rCtx.globalAlpha = 1; requestAnimationFrame(animateRipples); }
    function getCanvasCoords(clientX, clientY) { const rect = canvas.getBoundingClientRect(); return { x: clientX - rect.left, y: clientY - rect.top }; }

    // ==========================================
    // 遊戲核心邏輯 (Rings Nim Game)
    // ==========================================
    let gameState = "MENU", currentPlayer = "挑戰者";
    let numPillars = 0, columns = [], selectedCol = -1;
    let currentTurn = ""; 
    let ctx, canvas, pCtx, pCanvas, rCtx, rCanvas;

    function initSystem() {
        canvas = document.getElementById('main-canvas'); ctx = canvas.getContext('2d'); 
        pCanvas = document.getElementById('particle-canvas'); pCtx = pCanvas.getContext('2d'); 
        rCanvas = document.getElementById('ripple-canvas'); rCtx = rCanvas.getContext('2d');
        window.addEventListener('resize', () => { adaptCanvas(); checkDeviceLayout(); }); 
        checkDeviceLayout(); adaptCanvas();
        requestAnimationFrame(animateParticles); requestAnimationFrame(animateRipples);
        document.getElementById('player-name').addEventListener('keypress', function (e) { if (e.key === 'Enter') startGame(); });

        const pane = document.getElementById('geometry-pane');
        pane.addEventListener('pointerup', onPointerUp);
    }

    function checkDeviceLayout() { 
        const isMobile = window.innerWidth <= 1024 || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent); 
        setLayout(isMobile ? 'portrait' : 'landscape'); 
    }

    function setLayout(mode) {
        const wrapper = document.getElementById('main-wrapper');
        const btnP = document.getElementById('btn-portrait');
        const btnL = document.getElementById('btn-landscape');
        const statsCard = document.getElementById('stats-card');
        const rightPane = document.getElementById('right-pane');
        const geoPane = document.getElementById('geometry-pane');

        if(mode === 'portrait') {
            wrapper.classList.add('portrait');
            btnP.classList.add('active-layout'); btnL.classList.remove('active-layout');
            if(statsCard && geoPane) geoPane.appendChild(statsCard);
        } else {
            wrapper.classList.remove('portrait');
            btnL.classList.add('active-layout'); btnP.classList.remove('active-layout');
            if(statsCard && rightPane) rightPane.insertBefore(statsCard, rightPane.firstChild);
        }
        setTimeout(adaptCanvas, 50);
    }

    function enterFullScreen() { try { const elem = document.documentElement; if (elem.requestFullscreen) { let p = elem.requestFullscreen(); if(p) p.catch(()=>{}); } } catch (e) {} }
    function exitFullScreen() { try { if (document.exitFullscreen) document.exitFullscreen(); } catch (e) {} }
    function toggleFullScreen() { if (!document.fullscreenElement) enterFullScreen(); else exitFullScreen(); }
    document.addEventListener('fullscreenchange', () => {
        const btn = document.getElementById('fullscreen-toggle'); if(!btn) return;
        btn.innerText = !document.fullscreenElement ? "進入全屏 ⛶" : "退出全屏 ⛶";
    });

    window.forceUnlockAudio = function() {
        SoundManager.init(); if (!SoundManager.ctx) return;
        if (SoundManager.ctx.state === 'suspended') SoundManager.ctx.resume().catch(()=>{});
        const buffer = SoundManager.ctx.createBuffer(1, 1, 22050); const source = SoundManager.ctx.createBufferSource(); source.buffer = buffer; source.connect(SoundManager.ctx.destination); source.start(0);
    };

    function adaptCanvas() {
        const pane = document.getElementById('geometry-pane'); if(!pane) return;
        let cw = pane.clientWidth; let ch = pane.clientHeight; if (cw === 0 || ch === 0) return;
        canvas.width = cw; canvas.height = ch; pCanvas.width = cw; pCanvas.height = ch; rCanvas.width = cw; rCanvas.height = ch;
        if(gameState === "PLAYING") {
            drawScene();
        }
    }

    function showFloatingText(text, color) { 
        const el = document.createElement('div'); el.className = 'ritual-text'; el.innerText = text; el.style.color = color; 
        el.style.left = '50%'; el.style.top = '40%'; el.style.transform = 'translate(-50%, -50%)'; el.style.animation = 'flyUp 1s ease-out forwards'; 
        document.getElementById('geometry-pane').appendChild(el); setTimeout(() => el.remove(), 1000); 
    }

    function startGame() {
        try { SoundManager.init(); SoundManager.play('start'); SoundManager.startBGM(); } catch (e) {}
        enterFullScreen(); document.getElementById('fullscreen-toggle').classList.remove('hidden'); document.getElementById('btn-return').classList.remove('hidden'); 
        
        const nameInput = document.getElementById('player-name').value.trim(); 
        currentPlayer = nameInput !== "" ? nameInput : "挑戰者";

        document.getElementById("start-screen").classList.add("hidden"); 
        document.getElementById("main-wrapper").classList.remove("hidden");
        const goScreen = document.getElementById("game-over-screen"); if(goScreen) goScreen.remove();
        
        gameState = "PLAYING";
        
        // 隨機生成 5~7 條柱
        numPillars = Math.floor(Math.random() * 3) + 5; 
        columns = [];
        for (let i = 1; i <= numPillars; i++) {
            columns.push(i);
        }
        
        selectedCol = -1;
        currentTurn = Math.random() > 0.5 ? "player" : "ai";

        document.getElementById("question-text").innerText = `共有 ${numPillars} 條柱子`;
        
        updateUI();
        
        if (currentTurn === "ai") {
            setTimeout(aiLogic, 1500);
        }
    }

    function buildActionButtons() {
        const grid = document.getElementById("action-grid");
        const hint = document.getElementById("selection-hint");
        grid.innerHTML = "";
        
        if (currentTurn !== "player" || selectedCol === -1 || columns[selectedCol] === 0) {
            hint.style.display = "block";
            if(currentTurn === "ai") hint.innerText = "等待 AI 操作...";
            else if (selectedCol === -1) hint.innerText = "請先點擊畫面中要操作的柱子";
            else hint.innerText = "這根柱子已經空了";
            return;
        }

        hint.style.display = "none";
        
        // 按鈕: 拿 1 個
        const btnOne = document.createElement("button");
        btnOne.className = "take-btn";
        btnOne.innerText = "拿 1 個";
        btnOne.onclick = () => executeTake(selectedCol, 'one', true);
        grid.appendChild(btnOne);

        // 如果柱子大於1個，才顯示全拿
        if (columns[selectedCol] > 1) {
            const btnAll = document.createElement("button");
            btnAll.className = "take-btn";
            btnAll.innerText = "全部拿走";
            btnAll.style.background = "rgba(16, 185, 129, 0.2)";
            btnAll.style.borderColor = "var(--success)";
            btnAll.onclick = () => executeTake(selectedCol, 'all', true);
            grid.appendChild(btnAll);
        }
    }

    function updateUI() {
        const remDisplay = document.getElementById("rem-display");
        let totalRemaining = columns.reduce((a, b) => a + b, 0);
        remDisplay.innerText = totalRemaining;
        
        const turnDisplay = document.getElementById("turn-display");
        const fZone = document.getElementById("formula-zone");

        if (currentTurn === "player") {
            turnDisplay.innerText = `🟢 輪到你了，${currentPlayer}！`;
            turnDisplay.style.color = "var(--success)";
            remDisplay.className = "rem-box";
            fZone.classList.remove("locked");
        } else {
            turnDisplay.innerText = `🟣 AI 思考中...`;
            turnDisplay.style.color = "var(--ai-color)";
            remDisplay.className = "rem-box ai-turn";
            fZone.classList.add("locked");
            selectedCol = -1; // AI 回合取消玩家選取
        }
        
        buildActionButtons();
        drawScene();
    }

    // 計算特定套圈的精確物理座標，以供爆炸特效使用
    function getRingCoords(colIdx, ringIdx) {
        const padX = canvas.width * 0.1;
        const spacingX = (canvas.width - 2 * padX) / Math.max(1, numPillars - 1);
        const groundY = canvas.height * 0.85;
        const px = padX + colIdx * spacingX;
        // ringIdx: 0 is bottom, 1 is above it...
        const ry = groundY - 20 - ringIdx * 35;
        return {x: px, y: ry};
    }

    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const padX = canvas.width * 0.1;
        const spacingX = (canvas.width - 2 * padX) / Math.max(1, numPillars - 1);
        const groundY = canvas.height * 0.85;

        // 底座
        ctx.fillStyle = "#1e293b";
        ctx.beginPath();
        ctx.roundRect(padX - 40, groundY, (numPillars - 1) * spacingX + 80, 20, 10);
        ctx.fill();

        for (let i = 0; i < numPillars; i++) {
            let px = padX + i * spacingX;
            
            // 選取高光
            if (i === selectedCol) {
                ctx.fillStyle = "rgba(250, 204, 21, 0.15)";
                ctx.fillRect(px - spacingX*0.4, groundY - 350, spacingX*0.8, 360);
                ctx.strokeStyle = "rgba(250, 204, 21, 0.5)";
                ctx.lineWidth = 2;
                ctx.strokeRect(px - spacingX*0.4, groundY - 350, spacingX*0.8, 360);
            }

            // 柱子
            ctx.fillStyle = "#334155";
            ctx.beginPath();
            ctx.roundRect(px - 6, groundY - 300, 12, 300, 6);
            ctx.fill();

            // 套圈 (由下往上疊)
            for (let r = 0; r < columns[i]; r++) {
                let coords = getRingCoords(i, r);
                ctx.fillStyle = `hsl(${(i * 30 + r * 15) % 360}, 90%, 65%)`;
                
                ctx.beginPath();
                ctx.roundRect(coords.x - 30, coords.y - 12, 60, 24, 12);
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;

                // 立體高光
                ctx.beginPath();
                ctx.roundRect(coords.x - 20, coords.y - 6, 40, 6, 3);
                ctx.fillStyle = "rgba(255,255,255,0.4)";
                ctx.fill();
            }
        }
    }

    function onPointerUp(e) {
        if (gameState !== "PLAYING" || currentTurn !== "player") return;
        const pos = getCanvasCoords(e.clientX, e.clientY);
        
        const padX = canvas.width * 0.1;
        const spacingX = (canvas.width - 2 * padX) / Math.max(1, numPillars - 1);
        
        // 判斷點擊了哪一條柱子 (放寬點擊區域)
        let clickedCol = -1;
        for (let i = 0; i < numPillars; i++) {
            let px = padX + i * spacingX;
            if (Math.abs(pos.x - px) < spacingX * 0.45) {
                clickedCol = i;
                break;
            }
        }

        if (clickedCol !== -1 && columns[clickedCol] > 0) {
            selectedCol = clickedCol;
            createRipple(pos.x, pos.y);
            try{ SoundManager.play('select'); }catch(err){}
            updateUI();
        }
    }

    function executeTake(colIdx, type, isPlayer) {
        if(gameState !== "PLAYING") return;
        
        let ringsCount = columns[colIdx];
        let takeCount = (type === 'one') ? 1 : ringsCount;
        let color = isPlayer ? '#10B981' : '#A855F7';

        // 特效處理：找出被拿走的套圈座標
        for(let k = 0; k < takeCount; k++) {
            let removedRingIdx = ringsCount - 1 - k; // 從最上面開始拿
            let coords = getRingCoords(colIdx, removedRingIdx);
            createExplosion(coords.x, coords.y, color);
        }

        columns[colIdx] -= takeCount;
        selectedCol = -1; // 操作後取消選取

        if(isPlayer) {
            try{ SoundManager.play('take'); }catch(e){}
            showFloatingText(`-${takeCount}`, '#10B981');
        } else {
            try{ SoundManager.play('ai_take'); }catch(e){}
            showFloatingText(`AI 拿走 ${takeCount} 個`, '#A855F7');
            const geometryPane = document.getElementById("geometry-pane"); 
            geometryPane.classList.add("main-error"); 
            setTimeout(() => geometryPane.classList.remove("main-error"), 300);
        }

        let totalRemaining = columns.reduce((a, b) => a + b, 0);

        if (totalRemaining <= 0) {
            updateUI();
            setTimeout(() => endGame(isPlayer ? "player" : "ai"), 800);
        } else {
            currentTurn = isPlayer ? "ai" : "player";
            updateUI();
            if (currentTurn === "ai") {
                setTimeout(aiLogic, Math.random() * 1000 + 800);
            }
        }
    }

    // ------------------------------------------
    // SG 定理：完美 AI 運算核心
    // ------------------------------------------
    function getGrundy(x) {
        // 從數量 x，可以轉移到 x-1 (拿1個)，或轉移到 0 (拿全部)
        if (x === 0) return 0;
        return (x % 2 !== 0) ? 1 : 2;
    }

    function aiLogic() {
        if(gameState !== "PLAYING") return;
        
        let nimSum = 0;
        for (let x of columns) {
            nimSum ^= getGrundy(x);
        }

        let moveFound = false;

        // 如果處於必勝態 (nimSum != 0)，找出必勝轉移
        if (nimSum !== 0) {
            for (let i = 0; i < numPillars; i++) {
                if (columns[i] === 0) continue;
                
                let currentG = getGrundy(columns[i]);
                
                // 測試動作 1：拿走 1 個 (轉移至 columns[i]-1)
                let gAfterOne = getGrundy(columns[i] - 1);
                if ((nimSum ^ currentG ^ gAfterOne) === 0) {
                    executeTake(i, 'one', false);
                    moveFound = true; 
                    break;
                }
                
                // 測試動作 2：拿走全部 (轉移至 0)
                let gAfterAll = getGrundy(0);
                if ((nimSum ^ currentG ^ gAfterAll) === 0) {
                    executeTake(i, 'all', false);
                    moveFound = true; 
                    break;
                }
            }
        }

        // 如果處於必敗態 (nimSum == 0) 或沒找到 (理論上不可能)，則隨機拿
        if (!moveFound) {
            let validCols = [];
            for (let i = 0; i < numPillars; i++) {
                if (columns[i] > 0) validCols.push(i);
            }
            let randomCol = validCols[Math.floor(Math.random() * validCols.length)];
            let type = (columns[randomCol] > 1 && Math.random() > 0.5) ? 'all' : 'one';
            executeTake(randomCol, type, false);
        }
    }

    function returnToMenu() {
        try { SoundManager.stopBGM(); } catch(e) {} 
        gameState = "MENU";
        document.getElementById("btn-return").classList.add("hidden"); 
        document.getElementById('fullscreen-toggle').classList.add('hidden');
        document.getElementById("main-wrapper").classList.add("hidden");
        document.getElementById("start-screen").classList.remove("hidden");
        
        const goScreen = document.getElementById("game-over-screen");
        if(goScreen) goScreen.remove();
        if (document.fullscreenElement) exitFullScreen();
    }

    function endGame(winner) {
        try { SoundManager.stopBGM(); } catch(e){} 
        gameState = "GAMEOVER";
        document.getElementById('btn-return').classList.add('hidden');

        let title, subtitle, rewardHTML = "";

        if (winner === "player") {
            try { SoundManager.play('success'); } catch(e){} 
            title = `<h1 style="font-size: clamp(3rem, 6vw, 6rem); margin-bottom: 10px; color: var(--success); text-shadow: 0 0 50px rgba(16,185,129,0.8);">VICTORY!</h1>`;
            subtitle = `<div style="font-size: clamp(1.5rem, 3vw, 3rem); margin: 10px 0 20px 0; color: #F8FAFC;">你成功破解了完美 AI 的邏輯！</div>`;
            rewardHTML = `
            <div style="background: rgba(16, 185, 129, 0.2); border: 2px solid #10B981; border-radius: 15px; padding: 25px; margin: 20px 0; animation: pulseRank 1s infinite alternate; max-width: 600px; width: 90%;">
                <h2 style="color: #10B981; font-size: clamp(1.8rem, 4vw, 3rem); margin: 0; text-shadow: 0 0 15px rgba(16,185,129,0.8);">🎁 隱藏獎勵解鎖 🎁</h2>
                <p style="color: white; font-size: clamp(1.2rem, 2vw, 1.8rem); margin: 10px 0 0 0; font-weight: bold;">唯有超越演算法的運算，才能獲得此殊榮！</p>
            </div>`;
        } else {
            try { SoundManager.play('gameover'); } catch(e){} 
            title = `<h1 style="font-size: clamp(3rem, 6vw, 6rem); margin-bottom: 10px; color: var(--danger); text-shadow: 0 0 50px rgba(239,68,68,0.8);">DEFEAT</h1>`;
            subtitle = `<div style="font-size: clamp(1.5rem, 3vw, 3rem); margin: 10px 0 20px 0; color: #94A3B8;">AI 無情地帶走了最後一個套圈...</div>`;
        }

        const endScreen = document.createElement('div'); 
        endScreen.id = "game-over-screen";
        endScreen.className = "overlay";
        endScreen.innerHTML = `
        ${title}
        ${subtitle}
        ${rewardHTML}
        <button class="mega-btn" onclick="returnToMenu()" style="margin-top: 30px; background: #475569;">🏠 返回主選單</button>
        <button class="mega-btn" onclick="startGame()" style="margin-top: 15px;">🔄 再次挑戰</button>`;
        
        document.body.appendChild(endScreen); 
        createExplosion(window.innerWidth/2, window.innerHeight/3, winner === 'player' ? '#10B981' : '#EF4444');
    }

    initSystem();
</script>
